project: ade-phee
phase: 1

task:
  name: Pharmacovigilance adverse drug event extraction
  adapter: phee
  input: One sentence from a medical case report.
  output: JSON containing zero or more pharmacovigilance events.

data:
  name: PHEE V2
  repository: https://github.com/ZhaoyueSun/phee-with-chatgpt
  license: MIT
  source_commit: a90c680b08464e731635eb2d2f2c49be6ad5e3e5
  splits: Use the upstream train, dev, and test splits without reshuffling.
  mapping:
    event_type: Preserve Adverse_event or Potential_therapeutic_event.
    trigger: Use Trigger.text when it contains exactly one contiguous verbatim span.
    subject: Flatten Subject.text entities and discontinuous pieces into a verbatim string list in source order; use an empty list when absent.
    treatment: Flatten Treatment.text entities and discontinuous pieces into a verbatim string list in source order; use an empty list when absent.
    effect: Flatten Effect.text entities and discontinuous pieces into a verbatim string list in source order; use an empty list when absent.
    duplicate_source_spans: Keep the first occurrence in source order so schema lists contain unique items; report this normalization.
    incompatible_gold: Drop an event only when an annotated span is not verbatim in the sentence or the event type is invalid. Keep the sentence and report every reason.

output_schema:
  type: object
  additionalProperties: false
  required: [events]
  properties:
    events:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [event_type, trigger, subject, treatment, effect]
        properties:
          event_type:
            enum: [Adverse_event, Potential_therapeutic_event]
          trigger:
            type: string
            constraint: Must be copied verbatim from the input.
          subject:
            type: array
            items:
              type: string
            uniqueItems: true
            constraint: Every item must be copied verbatim from the input.
          treatment:
            type: array
            items:
              type: string
            uniqueItems: true
            constraint: Every item must be copied verbatim from the input.
          effect:
            type: array
            items:
              type: string
            uniqueItems: true
            constraint: Every item must be copied verbatim from the input.

metrics:
  primary:
    name: gated_strict_event_f1
    definition: Invalid JSON, schema violations, duplicate list items, invalid event types, or non-verbatim spans score zero. Valid outputs use one-to-one event matching with precision and recall. Per-event similarity is the mean trigger, treatment, and effect score; each role score is 0.9 times bag-of-tokens F1 over joined list items plus 0.1 when predicted and gold span sets match exactly. Both empty roles score 1 and one empty role scores 0.
  secondary:
    - valid_format_rate
    - phee_main_argument_exact_match
    - phee_main_argument_token_f1
    - subject_exact_match
    - subject_token_f1

quality_target:
  split: dev
  metric: gated_strict_event_f1
  target: 0.7655
  status: Re-scored Claude 5-shot dev baseline (0.7155) + 0.05 after fixing reasoning-block and FMAPI content-block parsing.

performance_targets:
  batch_throughput: At least 20 sentences per second on one H100.
  cost: Cost per 1,000 sentences must be lower than the best frontier model used for the baseline.

base_model: Qwen/Qwen3-4B-Instruct-2507

databricks:
  profile: fe-vm-lakebase-praneeth
  catalog: serverless_lakebase_praneeth_catalog
  schema: custom_llm
  volume: artifacts
  data_root: /Volumes/serverless_lakebase_praneeth_catalog/custom_llm/artifacts/data/phee_v2
  train: /Volumes/serverless_lakebase_praneeth_catalog/custom_llm/artifacts/data/phee_v2/train.jsonl
  dev: /Volumes/serverless_lakebase_praneeth_catalog/custom_llm/artifacts/data/phee_v2/dev.jsonl
  test: /Volumes/serverless_lakebase_praneeth_catalog/custom_llm/artifacts/data/phee_v2/test.jsonl
  data_card: /Volumes/serverless_lakebase_praneeth_catalog/custom_llm/artifacts/data/phee_v2/data_card.md

phase_1_gate:
  schema_checked: true
  metric_contract_checked: true
  hand_checked_dev_rows: 5
  ai_runtime_runs: 0

[project]
name = "jepa-wm"
version = "0.1.0"
description = "JEPA-style world models on Databricks: fine-tuning on AI Runtime, Unity Catalog, Model Serving"
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "numpy", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
tracking = ["mlflow>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jepa_wm"]

[tool.pytest.ini_options]
pythonpath = ["src", "train"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: imports follow the sys.path setup, a bare last expression displays it,
# and `spark`, `dbutils` and `display` are provided by the runtime.
"notebooks/*" = ["I001", "E402", "B018", "F821"]

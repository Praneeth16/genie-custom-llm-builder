# Sensor JEPA and baselines on synthetic telemetry. Placeholders are replaced with --override
# (see scripts/air.sh). Probe first: --override env_variables.MAX_STEPS=30 --override env_variables.SEEDS=0
experiment_name: jepa_wm_sensor
mlflow_experiment_directory: /Workspace/Shared/jepa_wm
mlflow_run_name: sensor_jepa
compute: {accelerator_type: GPU_1xA10, num_accelerators: 1}
environment:
  version: databricks_ai_v6
code_source:
  root_path: ".."
  include_paths: [src, train]
command: |-
  set -euo pipefail
  export PYTHONPATH=$CODE_SOURCE_PATH/src
  for seed in $SEEDS; do
    python $CODE_SOURCE_PATH/train/train_sensor_jepa.py --output "$OUTPUT/seed_$seed" --seed "$seed" --max-steps "$MAX_STEPS" $EXTRA_ARGS
  done
env_variables:
  OUTPUT: /Volumes/catalog/schema/artifacts/sensor
  SEEDS: "0 1 2"
  MAX_STEPS: "1500"
  EXTRA_ARGS: ""
timeout_minutes: 60
max_retries: 0
